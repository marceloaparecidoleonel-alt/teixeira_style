<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho — Teixeira Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/catalogo.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <style>
    .page-carrinho .navbar__logo { transform: scale(3.2); transform-origin: center; }
    /* Corrige sobreposição do bloco auth na navbar */
    .page-carrinho .navbar__actions { gap: 0.5rem; align-items: center; flex-wrap: nowrap; }
    .page-carrinho .auth-btn { width: auto !important; height: auto !important; display: inline-flex !important; align-items: center; gap: 0.4rem; padding: 0.3rem 0.5rem; white-space: nowrap; max-width: 200px; overflow: visible; }
    .page-carrinho .auth-btn .auth-btn__avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .page-carrinho .auth-btn .auth-btn__name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; }
    .page-carrinho .auth-btn .auth-btn__sair { flex-shrink: 0; }
    .page-carrinho .navbar__panel-link { display: none !important; }
    .page-carrinho .auth-btn__avatar { cursor: pointer; }
    .page-carrinho .auth-name { display: none; }
    /* Rodapé colado na parte inferior */
    .page-carrinho { display: flex; flex-direction: column; min-height: 100vh; }
    .page-carrinho .cart-page { flex: 1 0 auto; padding-top: 5rem; padding-bottom: 2rem; display: flex; flex-direction: column; justify-content: center; }
    .page-carrinho .cart-page__empty { padding: 1.5rem; }
    .page-carrinho .cart-page__title { text-align: center; }
    .page-carrinho .cat-footer { flex-shrink: 0; margin-top: auto; }
    /* Ajuste do rodapé */
    .page-carrinho .cat-footer { padding: 0; }
    .page-carrinho .cat-footer__inner { padding: 0.6rem 2rem; align-items: center; min-height: unset; }
    .page-carrinho .cat-footer__logo { height: 56px; width: auto; }
  </style>
</head>
<body class="page-carrinho">

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Início
      </a>
      <a href="index.html" class="navbar__brand">
        <img src="assets/images/imagem.png" alt="Teixeira Style" class="navbar__logo" />
      </a>
      <div class="navbar__actions">
        <button class="navbar__icon-btn auth-btn" data-action="login" title="Entrar / Sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <span class="auth-name navbar__user-name"></span>
        <a href="carrinho.html" class="navbar__icon-btn cart-btn" title="Carrinho">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="cart-page">
    <h1 class="cart-page__title">Seu Carrinho</h1>
    <div class="cart-page__empty hidden" id="cartEmpty">
      <p>Seu carrinho está vazio.</p>
      <a href="catalogo.html" class="btn btn--gold">Ver catálogo</a>
    </div>
    <div class="cart-page__content hidden" id="cartContent">
      <div class="cart-items" id="cartItems"></div>
      <aside class="cart-summary">
        <h2>Resumo</h2>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
        <div class="summary-row"><span>Frete</span><span id="shipping">A calcular</span></div>
        <div class="summary-row summary-row--total"><span>Total</span><span id="total">R$ 0,00</span></div>
        <a href="checkout.html" class="btn btn--gold btn--full" id="checkoutBtn">Continuar para pagamento</a>
        <button class="btn btn--outline btn--full" id="clearCartBtn">Limpar carrinho</button>
      </aside>
    </div>
  </main>

  <footer class="cat-footer">
    <div class="cat-footer__inner">
      <img src="assets/images/imagem.png" alt="Teixeira Style" class="cat-footer__logo" />
      <p>R. Cel. Joaquim Ribeiro Gomes, 20 · Ribeirão Claro — PR, 86410-000 · (43) 9 9601-9761 · @loja_teixeira_style</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart-ui.js"></script>
  <script>
    /* Carrinho: clique no avatar → abre painel; clique em Sair → logout */
    document.addEventListener('click', function(e) {
      const avatar = e.target.closest('.auth-btn__avatar');
      if (avatar) {
        e.stopImmediatePropagation();
        window.location.href = 'cliente.html';
      }
    }, true); /* capture=true para interceptar antes do delegador do auth.js */
  </script>
</body>
</html>
